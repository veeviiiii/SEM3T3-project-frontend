<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My week · Smart Scheduling</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Light or dark mode: apply the saved choice (or the computer's setting) before the page is drawn,
      // so it never flashes. The toggle button is in src/lib/theme.js.
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
      // A page-change animation can be skipped (for example in a hidden tab). That is fine, so it is not an error.
      addEventListener('pageswap', (event) => event.viewTransition?.ready.catch(() => {}));
      addEventListener('pagereveal', (event) => event.viewTransition?.ready.catch(() => {}));
    </script>
    <!-- Runs before the page is first shown, so the menu is already drawn (and page changes animate smoothly). -->
    <script type="module" src="/src/pages/faculty.js" blocking="render"></script>
  </head>
  <body class="min-h-screen bg-canvas text-slate-800">
    <header id="app-header"></header>

    <main class="mx-auto max-w-7xl px-4 pb-10 pt-2 sm:px-6">
      <!-- Moved into the top bar by renderHeader(). -->
      <h1 class="page-title">My week</h1>

      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <p class="text-sm text-slate-500">Your classes, and the leave you have marked.</p>
        <button type="button" class="btn-primary" id="mark-leave" disabled>
          Mark leave <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        </button>
      </div>

      <!-- Filled in after "Save leave": which classes were cancelled. -->
      <section class="mb-4 hidden" id="saved" aria-live="polite"></section>

      <section class="card mb-4 p-4">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-baseline gap-3">
            <h2 class="font-medium text-slate-900">Calendar</h2>
            <span class="text-xs text-slate-500" id="week-label"></span>
          </div>
          <div class="flex items-center gap-1">
            <button type="button" class="rounded-md p-1.5 text-slate-600 hover:bg-slate-100" id="prev-week" aria-label="Previous week">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" class="rounded-md p-1.5 text-slate-600 hover:bg-slate-100" id="next-week" aria-label="Next week">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <div id="week-grid"></div>
      </section>

      <section class="card p-4">
        <h2 class="mb-3 font-medium text-slate-900">My leave</h2>
        <div id="leave-list"></div>
      </section>
    </main>

    <dialog id="leave-dialog" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl bg-white shadow-xl backdrop:bg-black/50 backdrop:backdrop-blur-[2px]" aria-labelledby="leave-title">
      <form id="leave-form" class="grid gap-4 p-6" novalidate>
        <h2 class="text-lg font-semibold text-slate-900" id="leave-title">Mark leave</h2>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label" for="leave-from">From</label>
            <input class="input" id="leave-from" type="date" aria-describedby="from-error" />
            <p class="mt-1 hidden text-sm text-red-600" id="from-error" data-error></p>
          </div>
          <div>
            <label class="label" for="leave-to">To</label>
            <input class="input" id="leave-to" type="date" aria-describedby="to-error" />
            <p class="mt-1 hidden text-sm text-red-600" id="to-error" data-error></p>
          </div>
        </div>

        <fieldset aria-describedby="periods-error">
          <legend class="label">When in the day</legend>
          <div class="flex flex-wrap gap-4 text-sm">
            <label class="flex items-center gap-2"><input type="radio" name="scope" value="day" class="accent-blue-400" checked /> Whole day</label>
            <label class="flex items-center gap-2"><input type="radio" name="scope" value="some" class="accent-blue-400" /> Only some periods</label>
          </div>
          <div class="mt-2 hidden" id="period-boxes">
            <div class="flex flex-wrap gap-2" id="period-list"></div>
          </div>
          <p class="mt-1 hidden text-sm text-red-600" id="periods-error" data-error></p>
        </fieldset>

        <div>
          <label class="label" for="leave-reason">Reason</label>
          <input class="input" id="leave-reason" type="text" placeholder="For example: attending a conference" aria-describedby="reason-error" />
          <p class="mt-1 hidden text-sm text-red-600" id="reason-error" data-error></p>
        </div>

        <p class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" id="form-error" role="alert" data-error></p>

        <div class="flex justify-end gap-2">
          <button type="button" class="btn-secondary" id="cancel-leave">Cancel</button>
          <button type="submit" class="btn-primary" id="save-leave">Save leave</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
