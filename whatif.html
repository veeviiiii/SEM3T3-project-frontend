<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What-if · Smart Scheduling</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Light or dark mode: apply the saved choice (or the computer's setting) before the page is drawn,
      // so it never flashes. The toggle button is in src/lib/theme.js.
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
      // A page-change animation can be skipped (for example in a hidden tab). That is fine, so it is not an error.
      addEventListener('pageswap', (event) => event.viewTransition?.ready.catch(() => {}));
      addEventListener('pagereveal', (event) => event.viewTransition?.ready.catch(() => {}));
    </script>
    <!-- Runs before the page is first shown, so the menu is already drawn (and page changes animate smoothly). -->
    <script type="module" src="/src/pages/whatif.js" blocking="render"></script>
  </head>
  <body class="min-h-screen bg-canvas text-slate-800">
    <header id="app-header"></header>

    <main class="mx-auto max-w-7xl px-4 pb-10 pt-2 sm:px-6">
      <!-- Moved into the top bar by renderHeader(). -->
      <h1 class="page-title">What-if</h1>
      <p class="mb-4 text-sm text-slate-500">Try "what if this teacher, room or batch were unavailable?" before it happens. Nothing is saved until you press <b>Make it real</b>.</p>

      <div class="grid grid-cols-1 gap-4 lg:grid-cols-[22rem_minmax(0,1fr)]">
        <section class="card h-fit p-4">
          <h2 class="font-medium text-slate-900">Add a change</h2>
          <form id="change-form" class="mt-3 grid gap-3" novalidate>
            <div>
              <label class="label" for="kind">What happens</label>
              <select class="input" id="kind">
                <option value="faculty_leave">A teacher is on leave</option>
                <option value="room_closure">A room or lab is closed</option>
                <option value="batch_event">A batch is away (event)</option>
              </select>
            </div>
            <div>
              <label class="label" for="target">Who / which</label>
              <select class="input" id="target"></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="label" for="from">From</label>
                <input class="input" id="from" type="date" required />
              </div>
              <div>
                <label class="label" for="to">To</label>
                <input class="input" id="to" type="date" required />
              </div>
            </div>
            <fieldset>
              <legend class="label">When in the day</legend>
              <label class="mr-4 text-sm"><input type="radio" name="span" value="day" class="accent-blue-400" checked /> Whole day</label>
              <label class="text-sm"><input type="radio" name="span" value="some" class="accent-blue-400" /> Only some periods</label>
              <div id="periods" class="mt-2 hidden flex-wrap gap-2"></div>
            </fieldset>
            <div>
              <label class="label" for="reason">Reason <span class="font-normal text-slate-400">(optional)</span></label>
              <input class="input" id="reason" placeholder="For example: medical leave" />
            </div>
            <p id="form-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert"></p>
            <button type="submit" class="btn-primary">
              Add and simulate <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
            </button>
          </form>

          <div class="mt-5 border-t border-slate-100 pt-4">
            <div class="flex items-center justify-between">
              <h2 class="font-medium text-slate-900">Your changes</h2>
              <button type="button" id="undo" class="btn-secondary px-3 py-1.5" disabled>Undo last</button>
            </div>
            <ol id="changes" class="mt-2 space-y-2 text-sm"></ol>
          </div>
        </section>

        <section class="min-w-0" id="result" aria-live="polite"></section>
      </div>
    </main>
  </body>
</html>
