<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timetables · Smart Scheduling</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Light or dark mode: apply the saved choice (or the computer's setting) before the page is drawn,
      // so it never flashes. The toggle button is in src/lib/theme.js.
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
      // A page-change animation can be skipped (for example in a hidden tab). That is fine, so it is not an error.
      addEventListener('pageswap', (event) => event.viewTransition?.ready.catch(() => {}));
      addEventListener('pagereveal', (event) => event.viewTransition?.ready.catch(() => {}));
    </script>
    <!-- Runs before the page is first shown, so the menu is already drawn (and page changes animate smoothly). -->
    <script type="module" src="/src/pages/timetable.js" blocking="render"></script>
  </head>
  <body class="min-h-screen bg-canvas text-slate-800">
    <header id="app-header"></header>

    <main class="mx-auto max-w-7xl px-4 pb-10 pt-2 sm:px-6">
      <!-- Moved into the top bar by renderHeader(). -->
      <h1 class="page-title">Timetables</h1>
      <p class="mb-4 text-sm text-slate-500" id="subtitle">Look at any batch, teacher or room for any week.</p>

      <section class="card mb-4 p-4">
        <div class="flex flex-wrap items-end gap-4">
          <fieldset>
            <legend class="label">Show the timetable of</legend>
            <div class="inline-flex gap-1 rounded-lg border border-slate-200 bg-white p-1" id="mode">
              <label class="cursor-pointer">
                <input type="radio" name="mode" value="batch" class="peer sr-only" />
                <span class="block rounded-md px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 peer-checked:bg-card-blue peer-checked:text-slate-900 peer-focus-visible:outline-2 peer-focus-visible:outline-blue-400">Batch</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="mode" value="faculty" class="peer sr-only" />
                <span class="block rounded-md px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 peer-checked:bg-card-blue peer-checked:text-slate-900 peer-focus-visible:outline-2 peer-focus-visible:outline-blue-400">Teacher</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="mode" value="room" class="peer sr-only" />
                <span class="block rounded-md px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 peer-checked:bg-card-blue peer-checked:text-slate-900 peer-focus-visible:outline-2 peer-focus-visible:outline-blue-400">Room</span>
              </label>
            </div>
          </fieldset>
          <div class="w-full sm:w-80">
            <label class="label" for="target" id="target-label">Batch</label>
            <select class="input" id="target" disabled></select>
          </div>
        </div>
      </section>

      <section class="card p-4">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-baseline gap-3">
            <h2 class="font-medium text-slate-900" id="grid-title">This week</h2>
            <span class="text-xs text-slate-500" id="week-label"></span>
          </div>
          <div class="flex items-center gap-1">
            <button type="button" class="rounded-md p-1.5 text-slate-600 hover:bg-slate-100" id="prev-week" aria-label="Previous week">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" class="rounded-md p-1.5 text-slate-600 hover:bg-slate-100" id="next-week" aria-label="Next week">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <div id="week-grid"></div>
      </section>
    </main>
  </body>
</html>
